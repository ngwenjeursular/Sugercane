<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    >

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Sugercane — Welcome</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo">
                sugercane.
            </a>

            <a href="auth.html" class="nav-link">
                Sign in
            </a>
        </nav>

        <section class="hero-content">

            <div class="eyebrow">
                Something worth growing
            </div>

            <h1>
                Welcome<br>
                to Sugercane.
            </h1>

            <p class="hero-description">
                A simple place to start something new.
                Built with intention, designed to grow.
            </p>

            <a
                href="auth.html"
                class="cta"
                aria-label="Create an account or sign in"
            >
                Get started
                <span aria-hidden="true">→</span>
            </a>

        </section>

        <div class="side-text">
            Grow something meaningful
        </div>

        <!-- Sugarcane growth animation -->
        <div class="growth-animation" aria-hidden="true">

            <div class="soil"></div>

            <div class="cane">

                <!-- Leaves -->
                <div class="cane-leaf leaf-1"></div>
                <div class="cane-leaf leaf-2"></div>
                <div class="cane-leaf leaf-3"></div>
                <div class="cane-leaf leaf-4"></div>
                <div class="cane-leaf leaf-5"></div>

            </div>

        </div>

    </main>

</body>
</html>
