services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sugercane
      POSTGRES_USER: sugercane
      POSTGRES_PASSWORD: sugercane_dev
    ports:
      - "5433:5432"
    volumes:
      - sugercane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugercane -d sugercane"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sugercane_pgdata:
